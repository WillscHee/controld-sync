# =============================================================================
# ControlD Hagezi Sync — Configuration
# =============================================================================
# Copy this file to config.toml and customize it.
# DO NOT commit config.toml if it contains your API token.
# =============================================================================

[settings]
# Your ControlD API Write Token.
# Get it from: https://controld.com/dashboard/api
# You can also leave this empty and use the CONTROLD_API_TOKEN env var.
api_token = ""

# Uncomment to skip the upstream freshness report at the end of each sync run.
# This avoids unauthenticated GitHub API calls (60 req/hr limit) — useful for CI.
# show_freshness = false

# Set to true to preview changes without modifying anything.
dry_run = false

# Uncomment to override the fallback mirror base URL.
# Default: https://hagezi-mirror.dnsbunker.org/controld
# Only needed if you host your own mirror or the default changes.
# hagezi_mirror_base = "https://hagezi-mirror.dnsbunker.org/controld"

[profiles]
# Exact names of your ControlD profiles (case-sensitive).
names = ["Charles", "Sarah", "Tony", "Will"]

# =============================================================================
# FOLDER DEFINITIONS
# =============================================================================
# Each line under [folders] maps a friendly name → Hagezi JSON URL.
# The friendly name is what appears in your ControlD dashboard.
# =============================================================================

[folders]
"Apple Private Relay Allow" = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/controld/apple-private-relay-allow-folder.json"
"Native Tracker Amazon"     = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/controld/native-tracker-amazon-folder.json"
"Native Tracker Apple"      = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/controld/native-tracker-apple-folder.json"
"Native Tracker Microsoft"  = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/controld/native-tracker-microsoft-folder.json"
"Native Tracker TikTok"     = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/controld/native-tracker-tiktok-folder.json"
"Referral Allow"            = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/controld/referral-allow-folder.json"
"AWAvenue No.Unwelcome"     = "https://raw.githubusercontent.com/WillscHee/controld-hagezi-sync/main/lists/awavenue-no-unwelcome.json"
"DoH Whitelist"             = "https://raw.githubusercontent.com/WillscHee/controld-hagezi-sync/main/lists/doh-whitelist.json"

# =============================================================================
# PROFILE → FOLDER MAPPINGS
# =============================================================================
# For each profile, list which folders (by friendly name) it should receive.
# Use the exact names from the [folders] section above.
# =============================================================================

[profile_folders]
Charles = [
  "Apple Private Relay Allow",
  "Native Tracker Amazon",
  "Native Tracker Apple",
  "Native Tracker Microsoft",
  "Native Tracker TikTok",
  "Referral Allow",
  "AWAvenue No.Unwelcome",
  "DoH Whitelist"
]
Sarah = [
  "Apple Private Relay Allow",
  "Native Tracker Amazon",
  "Native Tracker Apple",
  "Native Tracker Microsoft",
  "Native Tracker TikTok",
  "Referral Allow",
  "AWAvenue No.Unwelcome",
  "DoH Whitelist"
]
Tony = [
  "Apple Private Relay Allow",
  "Native Tracker Amazon",
  "Native Tracker Apple",
  "Native Tracker Microsoft",
  "Native Tracker TikTok",
  "Referral Allow",
  "AWAvenue No.Unwelcome",
  "DoH Whitelist"
]
Will = [
  "Apple Private Relay Allow",
  "Native Tracker Amazon",
  "Native Tracker Apple",
  "Native Tracker Microsoft",
  "Native Tracker TikTok",
  "Referral Allow",
  "AWAvenue No.Unwelcome",
  "DoH Whitelist"
]
